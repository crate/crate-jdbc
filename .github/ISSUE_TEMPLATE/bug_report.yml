name: Bug report
description: Something in the driver does not behave as documented
labels: ["bug"]
body:

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: driver-version
    attributes:
      label: Driver version
      placeholder: "3.0.0"
    validations:
      required: true

  - type: dropdown
    id: artifact
    attributes:
      label: Artifact
      options:
        - crate-jdbc
        - crate-jdbc-standalone
        - not sure
    validations:
      required: true

  - type: input
    id: cratedb-version
    attributes:
      label: CrateDB version
      description: "`SELECT version['number'] FROM sys.nodes LIMIT 1`, or the CrateDB Cloud plan"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "temurin 21.0.5"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        The connection URL with credentials removed, the table definition, and
        the smallest piece of Java that shows the problem.
      render: java

  - type: textarea
    id: stacktrace
    attributes:
      label: Stack trace
      render: text
