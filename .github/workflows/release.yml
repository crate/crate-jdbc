name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

  # Allows a dry run that stops short of publishing.
  workflow_dispatch:

permissions:
  contents: write

jobs:

  verify:
    name: Verify the release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag names the version being built
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(./gradlew -q getVersion | tr -d '[:space:]')"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the project version $version" >&2
            exit 1
          fi
          case "$version" in
            *SNAPSHOT*) echo "Refusing to release a snapshot version" >&2; exit 1 ;;
          esac

      # Publishing to Maven Central cannot be taken back, so everything that
      # can refuse the release runs before it — including the notes, which the
      # publish job writes the GitHub release from.
      - name: Check that the version has release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: ./devtools/release_notes.sh "${GITHUB_REF_NAME}"

      - name: Run the tests and checks across the supported server range
        run: make verify

  publish:
    name: Publish to Maven Central
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_sonatypeTokenUsername: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypeTokenPassword: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./devtools/release_notes.sh "${GITHUB_REF_NAME}" > release-notes.txt
          ./gradlew standaloneJar cyclonedxBom
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.txt \
            "build/libs/crate-jdbc-standalone-${GITHUB_REF_NAME}.jar" \
            build/reports/crate-jdbc-sbom.json
