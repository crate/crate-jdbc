name: Tests

on:
  pull_request: ~
  push:
    branches:
      - master
      # Maintenance branches of a released minor, named after it.
      - '[0-9]+.[0-9]+'

  # Regressions in CrateDB or dependency releases should surface without
  # waiting for the next push.
  schedule:
    - cron: '0 5 * * 1'

  # Allow job to be triggered manually.
  workflow_dispatch:

# Cancel in-progress jobs when pushing to the same branch.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  test:

    name: "Test Java: ${{ matrix.java-version }} CrateDB: ${{ matrix.cratedb-image }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java-version: ['11', '17', '21', '25']
        cratedb-image: [
          'crate:6.0.8',
          'crate:latest',
        ]
        include:
          - java-version: '21'
            cratedb-image: 'crate/crate:nightly'

    env:
      CRATEDB_IMAGE: ${{ matrix.cratedb-image }}

    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      # Gradle needs a JDK of its own: it runs on 17 and later, while the
      # driver is built for, and here tested on, Java 11.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            ${{ matrix.java-version }}
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test -PtestJavaVersion=${{ matrix.java-version }}

      - name: Run integration tests
        run: ./gradlew integrationTest -PtestJavaVersion=${{ matrix.java-version }}

  # The whole suite against a cluster. Load balancing and the routing a cancel
  # request has to survive are driver defaults that one node leaves inert, so
  # the topology is an axis of its own rather than a cell of the matrix above.
  cluster:

    name: Test against a CrateDB cluster
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CRATEDB_NODES: 3

    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run integration tests
        run: ./gradlew integrationTest

  # The whole suite at an offset from UTC. Every conversion that goes through
  # the JVM's default calendar agrees with one that does not for as long as
  # the two are the same, so at UTC a whole class of fault is unreachable.
  time-zone:

    name: "Test in ${{ matrix.time-zone }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        time-zone: ['Europe/Berlin', 'America/Los_Angeles']

    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run integration tests
        run: ./gradlew integrationTest -PtestTimeZone=${{ matrix.time-zone }}

  # The suites against the standalone artifact, whose pgJDBC and Jackson are
  # relocated under io.crate.shade. A name that failed to relocate is invisible
  # to a check that reads the jar: it fails when it is used, and only a run
  # that carries values to a server uses it. The ordinary pgJDBC is kept off
  # that classpath, so a missed name finds nothing rather than finding the copy
  # every other job here supplies.
  standalone:

    name: Test the standalone artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run integration tests against the standalone jar
        run: ./gradlew standaloneTest

  # The whole suite over a different arrangement of the wire. The driver is a
  # layer over pgJDBC, so how pgJDBC sends a statement and decodes a value
  # decides which of its paths the driver's own conversions sit on top of, and
  # every one of those is a default an application can change.
  wire:

    name: "Test with ${{ matrix.properties }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        properties:
          - 'binaryTransfer=false'
          - 'prepareThreshold=1&defaultRowFetchSize=2'

    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run integration tests
        run: ./gradlew integrationTest -PtestConnectionProperties='${{ matrix.properties }}'

  # The simple protocol, over the suites that compute what they expect. It
  # sends a statement with its parameters written into the text, which is a
  # different path through pgJDBC for every value — and one the driver cannot
  # bind a nested or empty array through, since those are sent untyped for the
  # server to type from the column. `docs/limitations.rst` says so; what runs
  # here is the surface, which holds either way.
  simple-protocol:

    name: Test the surface over the simple protocol
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the derived surface suites
        run: >
          ./gradlew integrationTest -PtestConnectionProperties='preferQueryMode=simple'
          --tests '*DifferentialIT' --tests '*SelfConsistencyIT'

  # Programs the pull-request runs never draw. The suites that generate their
  # own questions ask the same ones every time so that a failure is the change
  # rather than the draw; this is where new ones get asked, from a seed the run
  # prints so that whatever it finds can be asked again.
  deep:

    name: Draw new values and programs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run integration tests from a seed of this run's own
        run: >
          ./gradlew integrationTest
          -PtestSeed=${{ github.run_id }} -PtestSequencePrograms=600

  # What the driver does when the network under it misbehaves. It starts a
  # server and a proxy of its own, so it is asked for rather than run with
  # everything else.
  faults:

    name: Test against a network that misbehaves
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the fault injection suite
        run: ./gradlew integrationTest -PtestFaults=true --tests '*FaultIT'

  # The faults the delta lays at pgJDBC's door, held against the database
  # pgJDBC was written for. A fault that reproduces there is one a maintainer
  # of that driver can be shown without CrateDB in the picture, and one that
  # stops reproducing is an entry that has outlived what it describes. Another
  # server, so it runs on its own rather than in every cell above.
  control:

    name: Test the inherited faults against stock PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the differential with the control cell
        run: ./gradlew integrationTest -PtestControl=true --tests '*DifferentialIT'

  # Code style and the artifact checks answer the same whichever server and JRE
  # the suites ran against, so they run once rather than in every cell of the
  # matrix above.
  verify:

    name: Verify sources and artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the checks
        run: ./gradlew check -x test
