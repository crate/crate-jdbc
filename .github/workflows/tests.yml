name: Tests

on:
  pull_request: ~
  push:
    branches:
      - master
  schedule:
    - cron: '0 5 * * 1'

  # Allow job to be triggered manually.
  workflow_dispatch:

# Cancel in-progress jobs when pushing to the same branch.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  test:

    name: "Test Java: ${{ matrix.java-version }} CrateDB: ${{ matrix.cratedb-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java-version: ['11', '21']
        cratedb-version: [
          '6.0.8',
          'latest',
        ]

    env:
      CRATE_VERSION: ${{ matrix.cratedb-version }}

    steps:

      - name: Acquire sources
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      # Gradle runs on 17, and the suites run on the matrix JDK.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            ${{ matrix.java-version }}
            17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run gradle test
        run: ./gradlew test -PtestJavaVersion=${{ matrix.java-version }}

  nightly:

    name: Test against CrateDB nightly
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CRATE_IMAGE: 'crate/crate:nightly'

    steps:

      - name: Acquire sources
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run gradle test
        run: ./gradlew test
