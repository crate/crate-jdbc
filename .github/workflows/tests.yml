name: Tests

on:
  pull_request: ~
  push:
    branches:
      - master
      # Maintenance branches of a released minor, named after it.
      - '[0-9]+.[0-9]+'

  # Regressions in CrateDB or dependency releases should surface without
  # waiting for the next push.
  schedule:
    - cron: '0 5 * * 1'

  # Allow job to be triggered manually.
  workflow_dispatch:

# Cancel in-progress jobs when pushing to the same branch.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  test:

    name: "Test Java: ${{ matrix.java-version }} CrateDB: ${{ matrix.cratedb-image }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java-version: ['11', '17', '21', '25']
        cratedb-image: [
          'crate:6.0.8',
          'crate:latest',
        ]
        include:
          - java-version: '21'
            cratedb-image: 'crate/crate:nightly'

    env:
      CRATEDB_IMAGE: ${{ matrix.cratedb-image }}

    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      # Gradle needs a JDK of its own: it runs on 17 and later, while the
      # driver is built for, and here tested on, Java 11.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            ${{ matrix.java-version }}
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test -PtestJavaVersion=${{ matrix.java-version }}

      - name: Run integration tests
        run: ./gradlew integrationTest -PtestJavaVersion=${{ matrix.java-version }}

  # The whole suite against a cluster. Load balancing and the routing a cancel
  # request has to survive are driver defaults that one node leaves inert, so
  # the topology is an axis of its own rather than a cell of the matrix above.
  cluster:

    name: Test against a CrateDB cluster
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CRATEDB_NODES: 3

    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run integration tests
        run: ./gradlew integrationTest

  # The whole suite at an offset from UTC. Every conversion that goes through
  # the JVM's default calendar agrees with one that does not for as long as
  # the two are the same, so at UTC a whole class of fault is unreachable.
  time-zone:

    name: "Test in ${{ matrix.time-zone }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        time-zone: ['Europe/Berlin', 'America/Los_Angeles']

    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run integration tests
        run: ./gradlew integrationTest -PtestTimeZone=${{ matrix.time-zone }}

  # What the suites reach of the hand-written classes. One JRE: the coverage
  # agent supports a narrower range of JDKs than the driver does, and the
  # answer does not depend on which one the suites ran on.
  coverage:

    name: Measure coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Measure coverage
        run: ./gradlew jacocoTestReport -Pcoverage

      - name: Publish the report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/reports/jacoco/test

  # The suites against the standalone artifact, whose pgJDBC and Jackson are
  # relocated under io.crate.shade. A name that failed to relocate is invisible
  # to a check that reads the jar: it fails when it is used, and only a run
  # that carries values to a server uses it. The ordinary pgJDBC is kept off
  # that classpath, so a missed name finds nothing rather than finding the copy
  # every other job here supplies.
  standalone:

    name: Test the standalone artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run integration tests against the standalone jar
        run: ./gradlew standaloneTest

  # Whether the suites would notice the driver being wrong, which is the
  # question coverage does not answer. Long: it reruns the covering tests for
  # every change it makes, one at a time against a shared server. Asked for
  # rather than run on every push.
  mutation:

    name: Report what no test objects to
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Started here rather than as a service container: CrateDB needs its
      # discovery setting on the command line, which a service container has
      # no way to pass.
      - name: Start a CrateDB for the run to share
        run: |
          docker run --detach --name cratedb --publish 5432:5432 \
            crate:latest -Cdiscovery.type=single-node -Cstats.enabled=true
          timeout 120 sh -c \
            'until docker exec cratedb curl -sf localhost:4200 >/dev/null; do sleep 2; done'

      - name: Change the driver and see what fails
        env:
          CRATE_URL: crate://localhost:5432/doc?user=crate
        run: ./gradlew mutationTest

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation
          path: build/reports/pitest

  # Code style, the generated-code check and the artifact checks answer the
  # same whichever server and JRE the suites ran against, so they run once
  # rather than in every cell of the matrix above.
  verify:

    name: Verify sources and artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Acquire sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the checks
        run: ./gradlew check -x test
