plugins {
    id 'java-library'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
    id 'org.cyclonedx.bom' version '2.4.1'
    id 'com.diffplug.spotless' version '8.0.0'
    id 'maven-publish'
    id 'signing'
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

repositories {
    mavenCentral()
}

ext.pgjdbcVersion = '42.7.13'

configurations {
    mutation
}

dependencies {
    api "org.postgresql:postgresql:${pgjdbcVersion}"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    // Jackson has no serializer for java.time out of the box, and refuses the
    // types rather than guessing at one. CrateDB timestamps are ordinary
    // values to bind, so the module that reads and writes them belongs here.
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.1'

    testImplementation 'org.hamcrest:hamcrest:3.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testImplementation 'org.testcontainers:cratedb:1.21.4'

    // Most applications reach the driver through a connection pool, which
    // exercises the corners the JDBC API leaves to the driver.
    testImplementation 'com.zaxxer:HikariCP:7.0.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Runs `mutationTest`. Held apart from the test classpath: it is a tool
    // the build launches, not something the suites compile against.
    mutation 'org.pitest:pitest-command-line:1.25.9'
    mutation 'org.pitest:pitest-junit5-plugin:1.2.3'
}

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

/**
 * Every source file carries the Apache license header, has no unused
 * imports, and ends in a newline. The generated Forwarding* classes are
 * covered too — the generator emits the same header.
 */
spotless {
    java {
        target 'driver/**/*.java', 'devtools/*.java'
        licenseHeaderFile 'gradle/license-header.txt'
        removeUnusedImports()
        endWithNewline()
        trimTrailingWhitespace()
    }
}

/**
 * The version the driver reports through {@code DatabaseMetaData} and
 * {@code java.sql.Driver}, written out from the version being built so that
 * a release cannot ship an artifact that misreports itself. It is packaged
 * next to the classes rather than added to the sources, which describe the
 * driver at every version.
 */
tasks.register('generateVersionResource', WriteProperties) {
    destinationFile = layout.buildDirectory.file('generated/version.properties')
    property 'version', project.version
}

tasks.named('processResources') {
    from(tasks.named('generateVersionResource')) {
        into 'io/crate/client/jdbc'
    }
}

sourceSets {
    main {
        java {
            srcDir 'driver/main/java'
        }
        resources {
            srcDir 'driver/main/resources'
        }
    }
    test {
        java {
            srcDir 'driver/test/java'
        }
    }
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
            username = project.hasProperty('sonatypeTokenUsername') ? sonatypeTokenUsername : ""
            password = project.hasProperty('sonatypeTokenPassword') ? sonatypeTokenPassword : ""
        }
    }
}

/**
 * An archive is a function of its sources alone: no build timestamps, and an
 * entry order of its own rather than the order the filesystem happens to walk
 * a directory in. Without the second, the same sources build to different
 * bytes on a machine whose filesystem enumerates differently, which is the
 * difference between a published artifact anyone can rebuild and one they can
 * only take on trust.
 */
tasks.withType(AbstractArchiveTask).configureEach {
    reproducibleFileOrder = true
    preserveFileTimestamps = false
}

jar {
    manifest {
        attributes(
            "Implementation-Title": "CrateDB JDBC Driver",
            "Implementation-Version": project.version,
            "Automatic-Module-Name": "io.crate.client.jdbc",
        )
    }
}

/**
 * crate-jdbc is the thin artifact: it declares its dependencies and bundles
 * nothing. The shadow plugin's own fat jar would otherwise be published
 * alongside it as a variant, carrying an unrelocated copy of pgJDBC — the
 * classpath clash `standaloneJar` goes to lengths to avoid.
 */
components.java.withVariantsFromConfiguration(configurations.shadowRuntimeElements) { skip() }
tasks.named('shadowJar') { enabled = false }

/**
 * Dependencies the standalone jar leaves out. pgJDBC only reads
 * checkerframework's annotations at compile time, so nothing looks for them
 * at runtime.
 */
ext.standaloneExclusions = ['org.checkerframework:checker-qual']

/**
 * The license and notice files of the dependencies the standalone jar
 * bundles, laid out the way pgJDBC lays out the ones it bundles itself:
 * META-INF/licenses/<artifact>/. Relocating a dependency's classes does not
 * relicense them, so its license has to travel with them.
 */
tasks.register('standaloneLicenses') {
    description = 'Collects the license files of the bundled dependencies.'
    def dependencies = configurations.runtimeClasspath
    def excluded = standaloneExclusions.collect { it.split(':')[1] }
    def outputDir = layout.buildDirectory.dir('standalone-licenses')
    inputs.files(dependencies)
    outputs.dir(outputDir)
    doLast {
        def target = outputDir.get().asFile
        target.deleteDir()
        dependencies.each { dependency ->
            def artifact = dependency.name.replaceFirst(/\.jar$/, '')
            if (excluded.any { artifact.startsWith(it + '-') }) {
                return
            }
            copy {
                from(zipTree(dependency)) {
                    include 'META-INF/*LICENSE*'
                    include 'META-INF/*NOTICE*'
                    eachFile { it.path = "META-INF/licenses/${artifact}/${it.name}" }
                }
                into target
                includeEmptyDirs = false
            }
        }
    }
}

/**
 * Reports the version being built, and nothing else — `devtools/create_tag.sh`
 * and the release workflow read it to hold the tag to the version.
 */
tasks.register('getVersion') {
    doLast {
        logger.quiet(project.version.toString())
    }
}

/**
 * The `java` the single-file programs under `devtools/` run on. They are
 * launched rather than compiled into a source set, so without this they would
 * take whichever JDK happens to come first on the developer's PATH — and
 * `GenerateForwarding` reflects over `java.sql`, whose interfaces grow from
 * one release to the next. Pinning it keeps what the build checks, and what
 * regenerating produces, the same on every machine.
 */
def devtoolsJava = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}.map { it.executablePath.asFile.absolutePath }

/**
 * Reports where the pgJDBC the build pins was resolved to, for running
 * `devtools/GenerateForwarding.java` against that exact version.
 */
tasks.register('printPgJdbcJar') {
    def pgjdbc = configurations.runtimeClasspath.filter { it.name.startsWith('postgresql-') }
    doLast {
        logger.quiet(pgjdbc.asPath)
    }
}

/**
 * Writes the Forwarding* classes over the checked-in ones. This is the only
 * way to regenerate them: it runs the generator against the pgJDBC the build
 * pins and on the JDK it pins, which is what `verifyForwardingClasses` then
 * holds the result to.
 */
tasks.register('generateForwardingClasses', Exec) {
    description = 'Regenerates the Forwarding* classes in place.'
    group = 'build'
    def pgjdbc = configurations.runtimeClasspath.filter { it.name.startsWith('postgresql-') }
    doFirst {
        commandLine devtoolsJava.get(), '-cp', pgjdbc.asPath, 'devtools/GenerateForwarding.java'
    }
}

/**
 * Self-contained variant for consumers that drop a single jar into a tool's
 * driver directory (Apache Hop, Pentaho, DBeaver manual setup). All bundled
 * dependencies are relocated under io.crate.shade so the jar cannot clash
 * with another pgjdbc or jackson on the same classpath. The relocated
 * `io.crate.shade.org.postgresql` namespace is a published API kept stable
 * for existing consumers (e.g. sslfactory configuration values).
 */
tasks.register('standaloneJar', ShadowJar) {
    dependsOn tasks.named('standaloneLicenses')
    archiveBaseName.set('crate-jdbc-standalone')
    archiveClassifier.set('')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    configurations = [project.configurations.runtimeClasspath]
    from sourceSets.main.output
    manifest {
        attributes(
            "Implementation-Title": "CrateDB JDBC Driver (Standalone)",
            "Implementation-Version": project.version,
            "Bundled-PgJdbc-Version": pgjdbcVersion,
            "Automatic-Module-Name": "io.crate.client.jdbc.standalone",
        )
    }

    dependencies {
        project.standaloneExclusions.each { exclude(dependency(it)) }
    }

    // The bundled pgjdbc must not self-register with the DriverManager: only
    // CrateDriver may answer jdbc:crate:// URLs, and jdbc:postgresql:// is
    // deliberately left to a (potentially co-installed) vanilla pgjdbc. The
    // exclude drops every service entry (matched against source-relative
    // paths); the child spec below re-adds only CrateDriver's, unmatched by
    // the exclude because its source-relative path is just "java.sql.Driver".
    // The bundled jackson's service entries go with them: they name classes
    // under their original package, which relocation has moved away.
    exclude 'META-INF/services/**'
    from('driver/main/resources/META-INF/services') {
        include 'java.sql.Driver'
        into 'META-INF/services'
    }

    // A module descriptor from a bundled dependency names packages that
    // relocation has renamed, so it describes nothing in this jar.
    exclude '**/module-info.class'
    // Build and framework metadata of the bundled dependencies, which
    // describes them rather than this jar.
    exclude 'META-INF/maven/**'
    exclude 'META-INF/**/OSGI-INF/**'
    exclude 'OSGI-INF/**'

    // Licenses are re-added from standaloneLicenses, one directory per
    // dependency, so that files of the same name do not displace each other.
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'META-INF/*-LICENSE'
    from(tasks.named('standaloneLicenses'))
    from('LICENSE') { into 'META-INF' }
    from('NOTICE') { into 'META-INF' }

    relocate 'org.postgresql', 'io.crate.shade.org.postgresql'
    relocate 'com.fasterxml.jackson', 'io.crate.shade.com.fasterxml.jackson'
}

/**
 * Checks what each artifact contains and how it behaves on the classpaths it
 * lands on. Each cell is a JVM of its own, because what they check is how the
 * classes initialize and register — which a JVM decides once.
 *
 * <p>Three things vary: the artifact, the arrangement its classes are loaded
 * in, and which class an application touches first. The thin artifact's pgJDBC
 * belongs to the application and has to keep answering `jdbc:postgresql://`;
 * the standalone's is a relocated copy that must never answer it. Both claims
 * are decided in a class initializer, so both need the scenarios rather than a
 * reading of the code. `devtools/VerifyArtifacts.java` names them; the
 * `alongside-pg` cell is the only one that puts anything on the classpath the
 * artifact does not bring itself.</p>
 */
def standaloneJarFile = tasks.named('standaloneJar').flatMap { it.archiveFile }
def thinJarFile = tasks.named('jar').flatMap { it.archiveFile }
def shadePrefix = 'io.crate.shade'

def artifactScenarios = [
    standalone: ['alone', 'data-source-first', 'driver-class-first', 'plugin-classloader', 'alongside-pg'],
    thin      : ['alone', 'data-source-first', 'driver-class-first', 'plugin-classloader'],
]

def artifactChecks = artifactScenarios.collectMany { artifact, scenarios ->
    scenarios.collect { scenario ->
        tasks.register("verifyArtifact-${artifact}-${scenario}", Exec) {
            dependsOn tasks.named(artifact == 'thin' ? 'jar' : 'standaloneJar')
            def dependencies = configurations.runtimeClasspath
            def pgjdbc = configurations.runtimeClasspath.filter { it.name.startsWith('postgresql-') }
            doFirst {
                def classpath = artifact == 'thin'
                    ? thinJarFile.get().asFile.absolutePath + File.pathSeparator + dependencies.asPath
                    : standaloneJarFile.get().asFile.absolutePath
                def runtime = scenario == 'alongside-pg'
                    ? classpath + File.pathSeparator + pgjdbc.asPath
                    : classpath
                commandLine devtoolsJava.get(), '-cp', runtime, 'devtools/VerifyArtifacts.java',
                    artifact, scenario, shadePrefix, classpath
            }
        }
    }
}

tasks.register('verifyArtifacts') {
    description = 'Verifies the contents and classpath behavior of both artifacts.'
    group = 'verification'
    dependsOn artifactChecks
}

check.dependsOn 'verifyArtifacts'

tasks.register('standaloneSourcesJar', Jar) {
    archiveBaseName.set('crate-jdbc-standalone')
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

tasks.register('standaloneJavadocJar', Jar) {
    dependsOn javadoc
    archiveBaseName.set('crate-jdbc-standalone')
    archiveClassifier.set('javadoc')
    from javadoc.destinationDir
}

project.ext.url = 'https://crate.io'
project.ext.scm = {
    url = 'https://github.com/crate/crate-jdbc'
    connection = 'scm:git:git://github.com/crate/crate-jdbc.git'
    developerConnection = 'scm:git:ssh:git@github.com:crate/crate-jdbc.git'
}
project.ext.licenses = {
    license {
        name = 'The Apache Software License, Version 2.0'
        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
        distribution = 'repo'
    }
}
project.ext.developers = {
    developer {
        id = 'crate'
        name = 'Crate Developers'
        email = 'office@crate.io'
    }
}

/**
 * A bill of materials for what the driver pulls in, so that consumers can
 * audit the standalone jar's bundled dependencies too — relocation hides
 * them from the scanners that read a pom.
 */
cyclonedxBom {
    includeConfigs = ['runtimeClasspath']
    outputFormat = 'json'
    outputName = 'crate-jdbc-sbom'
    destination = layout.buildDirectory.dir('reports').get().asFile
}

def sbom = layout.buildDirectory.file('reports/crate-jdbc-sbom.json').get().asFile

publishing {
    publications {
        jdbc(MavenPublication) {
            artifactId = 'crate-jdbc'
            from components.java
            artifact(sbom) { classifier = 'cyclonedx'; extension = 'json'; builtBy tasks.named('cyclonedxBom') }
            pom {
                name = "crate-jdbc"
                description = "CrateDB JDBC Driver"
                url = project.ext.url
                licenses project.ext.licenses
                developers project.ext.developers
                scm project.ext.scm
            }
        }
        jdbcStandalone(MavenPublication) {
            artifactId = 'crate-jdbc-standalone'
            artifact standaloneJar
            artifact standaloneSourcesJar
            artifact standaloneJavadocJar
            artifact(sbom) { classifier = 'cyclonedx'; extension = 'json'; builtBy tasks.named('cyclonedxBom') }
            pom {
                name = "crate-jdbc-standalone"
                description = "CrateDB JDBC Driver (Standalone)"
                url = project.ext.url
                licenses project.ext.licenses
                developers project.ext.developers
                scm project.ext.scm
            }
        }
    }
}

signing {
    def signingKey = findProperty("signingKey")
    def signingPassword = findProperty("signingPassword")
    // Publishing to Maven Central needs signatures, and a build that reaches
    // it without a key has to say so rather than upload artifacts Central
    // rejects. Everything else — publishToMavenLocal above all — signs only
    // when a key happens to be configured. The task graph is asked by path.
    required = { gradle.taskGraph.hasTask(":publishToSonatype") }
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign(publishing.publications)
}


/**
 * The release the tests run on. The driver is built for Java 11 while the
 * build itself needs a newer JDK, so `-PtestJavaVersion=11` puts the suites
 * on the baseline rather than only compiling for it. Left out, they run on
 * the JDK running the build.
 */
def testJavaVersion = providers.gradleProperty('testJavaVersion')

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    if (testJavaVersion.present) {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(testJavaVersion.get())
        }
    }
    // The driver reports its own version through CrateDriverVersion; the test
    // suite holds it against the version the artifact is built with.
    systemProperty 'project.version', project.version
    // Timestamps without time zone read back as wall-clock time in the JVM
    // zone; pin it so assertions are deterministic across machines and CI.
    // `-PtestTimeZone=Europe/Berlin` runs the suites at an offset instead,
    // which is the only way the paths that go through the default calendar
    // are exercised at all — at UTC a conversion that uses it and one that
    // does not give the same answer.
    systemProperty 'user.timezone', providers.gradleProperty('testTimeZone').getOrElse('UTC')
    // The docker-java bundled with testcontainers speaks Docker API 1.32 by
    // default, which Docker Engine 29+ rejects (its minimum is 1.44).
    // Pin a version every current engine accepts; -Dapi.version overrides.
    systemProperty 'api.version', System.getProperty('api.version', '1.44')
    // Integration test classes share one server and create tables in the
    // schemas they all read, so they have to run one at a time.
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    testLogging.showStandardStreams = true
}

/**
 * The tests that need no server, so that a plain `gradlew test` runs
 * without Docker. The integration tests live in the *IT classes and run
 * against a real CrateDB.
 */
test {
    filter {
        excludeTestsMatching '*IT'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs the integration tests against a CrateDB container.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching '*IT'
    }
    // The server they run against is not an input the build can see, so a
    // previous run against another CrateDB says nothing about this one.
    outputs.upToDateWhen { false }
}

/**
 * The suites again with assertions off, which is how every JVM not started
 * with `-ea` runs them.
 *
 * <p>pgJDBC asks the server to describe a statement under
 * `preferQueryMode=simple`, where the protocol has no message to carry the
 * answer. An assertion catches that; without one the request falls through
 * into the simple-query path and the statement is executed — so a metadata
 * call writes to the database. The two outcomes are mutually exclusive, and
 * only this task reaches the one applications actually meet.</p>
 *
 * <p>Tests that apply to one setting and not the other say so with an
 * assumption, so both this task and `integrationTest` report skips. That is
 * the arrangement working, not a suite going missing.</p>
 */
tasks.register('integrationTestNoAssertions', Test) {
    description = 'Runs the integration tests that only behave that way with assertions disabled.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    enableAssertions = false
    filter {
        includeTestsMatching '*SimpleQueryModeIT'
    }
    outputs.upToDateWhen { false }
}

/**
 * The suites against the standalone artifact, with a real server behind them.
 *
 * <p>`verifyArtifacts` reads what the jars contain and settles which driver
 * answers which URL scheme, in a process that connects to nothing. What it
 * cannot see is a relocated class that only fails once it is used: a class
 * named in a string, a service looked up by name, a resource read by path.
 * Those need the driver to actually carry a value to a server and back, which
 * is what the suites do.
 *
 * <p>The unrelocated pgJDBC is kept off the classpath, and so are this
 * project's own class files — the driver has to come out of the jar being
 * tested, and a name it failed to relocate has to find nothing rather than
 * find the copy an ordinary run would have supplied.</p>
 *
 * <p>A suite naming a pgJDBC type by its plain package cannot run here: under
 * this artifact those types live under the shade prefix, so the name resolves
 * to nothing. Such a suite says so with a tag. This is the same thing
 * `docs/migration.rst` tells an application that imported the shaded names.</p>
 */
tasks.register('standaloneTest', Test) {
    description = 'Runs the integration tests against the standalone artifact.'
    group = 'verification'
    dependsOn tasks.named('standaloneJar')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = files(standaloneJarFile) + sourceSets.test.output +
        configurations.testRuntimeClasspath.filter { !it.name.startsWith('postgresql-') }
    useJUnitPlatform {
        excludeTags 'pgjdbc-types'
    }
    // A pattern rather than a filter: a filter is applied after the candidates
    // have been loaded, and the unit tests among them name pgJDBC types that
    // this classpath has under another name.
    include '**/*IT.class'
    outputs.upToDateWhen { false }
}

jacoco {
    toolVersion = '0.8.15'
}

/**
 * Coverage is off unless `-Pcoverage` asks for it. The agent would otherwise
 * attach to every test run, including the cells of the CI matrix on the
 * newest JREs, where a coverage tool is the part of the toolchain most likely
 * to lag behind the JDK. Measuring is a thing to ask for, on one JDK, rather
 * than a tax on every run.
 */
def coverage = providers.gradleProperty('coverage')

tasks.withType(Test).configureEach {
    jacoco {
        enabled = coverage.present
    }
}

/**
 * What the suites reach of the classes this project actually writes.
 *
 * <p>The generated Forwarding* classes are left out. They are delegation and
 * nothing else, they outnumber the hand-written classes, and they are already
 * held to a fresh generation by `verifyForwardingClasses` — counting them
 * would answer a question nobody asked with a number large enough to bury the
 * one they did.</p>
 *
 * <p>Execution data is taken from every suite that ran, because most of the
 * driver is only reachable with a server behind it: a report over the unit
 * tests alone would describe the project as barely tested.</p>
 */
tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test'), tasks.named('integrationTest'),
        tasks.named('integrationTestNoAssertions')
    executionData.setFrom(fileTree(layout.buildDirectory.dir('jacoco')).include('*.exec'))
    classDirectories.setFrom(sourceSets.main.output.asFileTree.matching {
        exclude '**/Forwarding*.class'
    })
    reports {
        xml.required = true
        html.required = true
    }
}

/**
 * Whether the suites would notice if the driver were wrong.
 *
 * <p>Coverage counts the lines a run reached, which a suite that asserts
 * nothing scores just as well on. This changes a line — an operator, a
 * constant, a returned value — and reruns the tests that covered it: a change
 * no test objects to is a line nothing is holding. The report at
 * {@code build/reports/pitest} lists those, and they are the point of running
 * it; the percentage is a summary of them.</p>
 *
 * <p>The generated Forwarding* classes are left out for the reason the
 * coverage report leaves them out. They pass their arguments on and return
 * what came back; a change to one of them is a change to which method is
 * called, which the generation check already holds.</p>
 *
 * <p>The server comes from outside. The suites boot a CrateDB of their own per
 * JVM, and this starts a JVM per batch of changes, so a run that started its
 * own would spend its time on containers; {@code CRATE_URL} is the arrangement
 * the suites already have for a server someone else is running. One change is
 * tried at a time for the same reason the suites run one class at a time: they
 * share that server, and a run that dropped the tables another was reading
 * would report a failure that is the arrangement rather than the change.</p>
 */
tasks.register('mutationTest', JavaExec) {
    description = 'Changes the hand-written classes and reports what no test objects to.'
    group = 'verification'
    dependsOn tasks.named('testClasses')

    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(
            providers.gradleProperty('testJavaVersion').getOrElse('21') as Integer)
    }
    mainClass = 'org.pitest.mutationtest.commandline.MutationCoverageReport'
    classpath = configurations.mutation

    def report = layout.buildDirectory.dir('reports/pitest')
    def underTest = sourceSets.test.runtimeClasspath
    def mainClasses = sourceSets.main.output.classesDirs
    def server = providers.environmentVariable('CRATE_URL')

    doFirst {
        if (!server.present) {
            throw new GradleException(
                'Set CRATE_URL to a CrateDB this run may use, e.g.\n'
                + '  CRATE_URL=crate://localhost:5432/doc?user=crate make mutation\n'
                + 'Every JVM this starts would otherwise boot a container of its own.')
        }
        environment 'CRATE_URL', server.get()
        args '--classPath', underTest.files.join(','),
            '--sourceDirs', 'driver/main/java',
            // The driver, and nothing else on that classpath. Package globs
            // would take the suites in too — they sit under the same root, and
            // changing a test to see whether anything notices is a question
            // about the suite that asks it, not about the driver.
            '--mutableCodePaths', mainClasses.files.join(','),
            // Narrowed with -PmutationClasses / -PmutationTests, which is how
            // one class is asked again after a gap the report found is closed.
            '--targetClasses', providers.gradleProperty('mutationClasses')
                .getOrElse('io.crate.client.jdbc.*'),
            '--excludedClasses', 'io.crate.client.jdbc.Forwarding*',
            '--targetTests', providers.gradleProperty('mutationTests')
                .getOrElse('io.crate.client.jdbc.*'),
            // The suites that bring up a server whatever CRATE_URL says,
            // because the server is what they are about — a cluster, and one
            // that asks who is connecting. Either would be started again for
            // every change tried against a line it covers.
            '--excludedTestClasses', 'io.crate.client.jdbc.integrationtests.ClusterIT,' +
                'io.crate.client.jdbc.integrationtests.AuthenticationIT',
            '--testPlugin', 'junit5',
            '--reportDir', report.get().asFile.absolutePath,
            '--outputFormats', 'HTML,XML',
            '--timestampedReports', 'false',
            '--threads', '1',
            // A statement under test may be waiting out a query timeout of its
            // own, which is seconds rather than the milliseconds a local
            // server answers in.
            '--timeoutConst', '30000',
            '--jvmArgs', [
                "-Dproject.version=${project.version}",
                '-Duser.timezone=UTC',
                "-Dapi.version=${System.getProperty('api.version', '1.44')}",
                '-Djunit.jupiter.execution.parallel.enabled=false',
            ].join(',')
    }
}

/**
 * The Forwarding* classes are generated from the JDBC and pgJDBC interfaces
 * (see devtools/GenerateForwarding.java). Regenerating has to leave the
 * checked-in files untouched; anything else means the sources and the
 * interfaces they wrap have drifted apart.
 */
tasks.register('verifyForwardingClasses', Exec) {
    description = 'Checks the generated Forwarding* classes against a fresh generation.'
    group = 'verification'
    def generated = layout.buildDirectory.dir('generated-forwarding')
    def pgjdbc = configurations.runtimeClasspath.filter { it.name.startsWith('postgresql-') }
    doFirst {
        delete generated
        commandLine devtoolsJava.get(), '-cp', pgjdbc.asPath,
            'devtools/GenerateForwarding.java', generated.get().asFile.absolutePath
    }
    doLast {
        def committed = file('driver/main/java/io/crate/client/jdbc')
        def fresh = (generated.get().asFile.listFiles() ?: [] as File[]).collectEntries { [(it.name): it] }
        def checkedIn = committed.listFiles().findAll { it.name.startsWith('Forwarding') }
            .collectEntries { [(it.name): it] }

        (fresh.keySet() + checkedIn.keySet()).each { name ->
            if (fresh[name]?.text != checkedIn[name]?.text) {
                throw new GradleException(
                    "${name} differs from a fresh generation; regenerate with `make forwarding`")
            }
        }
    }
}

check.dependsOn 'verifyForwardingClasses'

wrapper {
    gradleVersion = '9.4.0'
}
